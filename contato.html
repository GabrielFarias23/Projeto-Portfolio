<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styleContato.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio</title>
</head>
<body>
<div class="contato">
  <h1>Contato</h1>
  <form id="contact-form">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="mensagem">Mensagem:</label>
    <textarea id="mensagem" name="mensagem" required></textarea>

    <button type="submit">Enviar</button>
  </form>
  <p id="status"></p>
</div>
    
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  emailjs.init("5bj-t6upyzOd1OoQl"); // substitua pela sua chave

  const form = document.getElementById('contact-form');
  const status = document.getElementById('status');

  form.addEventListener('submit', function(event) {
    event.preventDefault();

    emailjs.sendForm('service_ubo3pp5', 'template_dhvtjtj', this)
      .then(() => {
        status.innerText = "Mensagem enviada com sucesso!";
        form.reset();
      }, (err) => {
        status.innerText = "Erro ao enviar: " + JSON.stringify(err);
      });
  });
</script>
    
</body>
</html>
