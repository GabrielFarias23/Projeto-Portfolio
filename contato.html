<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styleContato.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio</title>
</head>
<body>
<div class="contato">

    <div class="entrarCont"><h1 class="entreContato">ENTRE EM CONTATO</h1><i class="fa-solid fa-envelope"></i></div>

  <form id="contact-form">

    <input type="text" id="nome" name="nome" placeholder="Digite seu nome">

    <input type="email" id="email" name="email" placeholder="Digite um email válido">

    <label for="mensagem"></label>
    <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem"></textarea>

    <button type="submit">Enviar</button>
  </form>

  <p id="status"></p>

</div>
    
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  emailjs.init("5bj-t6upyzOd1OoQl"); // substitua pela sua chave

  const form = document.getElementById('contact-form');
  const status = document.getElementById('status');

  form.addEventListener('submit', function(event) {
    event.preventDefault();

    emailjs.sendForm('service_ubo3pp5', 'template_dhvtjtj', this)
      .then(() => {
        status.innerText = "Mensagem enviada com sucesso!";
        form.reset();
      }, (err) => {
        status.innerText = "Erro ao enviar: " + JSON.stringify(err);
      });
  });
</script>
    
</body>
</html>
